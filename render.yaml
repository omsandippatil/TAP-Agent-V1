services:
  - type: web
    name: fundfinder
    runtime: docker
    envVars:
      - {key: APP_ENV, value: production}
      - {key: SESSION_SECRET, generateValue: true}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_KEY, sync: false}
      - {key: SUPABASE_ANON_KEY, sync: false}
      - {key: ANTHROPIC_API_KEY, sync: false}
      - {key: GOOGLE_SEARCH_API_KEY, sync: false}
      - {key: GOOGLE_SEARCH_ENGINE_ID, sync: false}